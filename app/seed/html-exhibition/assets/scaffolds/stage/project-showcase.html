<!doctype html>
<html lang="zh-CN" data-deck-mode="stage">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Project Showcase</title>
  <link rel="stylesheet" href="./styles/theme.css">
  <link rel="stylesheet" href="./styles/page.css">
  <link rel="stylesheet" href="./styles/motion.css">
  <link rel="stylesheet" href="./styles/print.css">
</head>
<body>
  <div class="deck-progress" data-deck-progress role="progressbar" aria-label="演示进度"></div>
  <main data-deck data-deck-mode="stage" aria-label="项目演示">
    <!-- SLIDES:START -->
    <section class="stage-slide is-active" data-slide id="slide-01" aria-label="第 1 页">
      <div class="stack">
        <p class="prompt">project showcase</p>
        <h1 class="hero-title">用一句话说清楚项目的核心价值。</h1>
        <p class="lede" data-fragment>这里放支撑核心判断的最短说明。</p>
      </div>
    </section>

    <section class="stage-slide" data-slide id="slide-02" aria-label="第 2 页">
      <div class="stack">
        <p class="eyebrow">01 / Mechanism</p>
        <h2 class="heading">用概念动画演示项目真实机制。</h2>
        <div class="concept-stage" data-concept-stage>
          <span class="concept-node">INPUT</span>
          <span class="concept-packet" aria-hidden="true"></span>
          <span class="concept-node">OUTPUT</span>
        </div>
        <button class="term-nav" type="button" data-replay>重播流程</button>
      </div>
    </section>
    <!-- SLIDES:END -->
  </main>

  <aside class="deck-overlay" data-deck-help hidden aria-hidden="true">
    下一步：→／↓／PageDown／Space　上一步：←／↑／PageUp／Shift+Space　首尾：Home／End　全屏：F
  </aside>
  <output class="deck-overlay" data-key-debug hidden aria-hidden="true"></output>

  <script src="./scripts/concept-animation.js"></script>
  <script src="./scripts/deck-runtime.js"></script>
  <script src="./scripts/main.js"></script>
</body>
</html>
